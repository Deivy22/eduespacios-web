<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>EduEspacios — Gestión Académica y Laboratorios</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23EADBFF'/%3E%3Cpath d='M16 7L5 13l11 6 11-6-11-6zm-7 9.5V22c0 1.8 3.1 3.5 7 3.5s7-1.7 7-3.5v-5.5' fill='none' stroke='%234C1D95' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <meta
    name="description"
    content="Portal universitario EduEspacios para gestión de tutorías académicas, reserva de laboratorios y seguimiento de reservas."
  />

  <!-- Tipografía Plus Jakarta Sans e Iconografía Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <!-- Tailwind CSS + Tema Pastel Centralizado -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./src/styles/tailwind-theme.js"></script>

  <!-- Hojas de estilo modulares -->
  <link rel="stylesheet" href="./src/styles/theme.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-pastel-lila selection:text-pastel-lila-ink">
  <!-- Cabecera fija superior (Escritorio y Móvil) -->
  <header
    id="app-header"
    class="fixed top-0 inset-x-0 z-40 glass-header pt-safe"
  ></header>

  <!-- Contenedor principal de la vista activa -->
  <main
    id="app-main"
    class="flex-1 w-full max-w-5xl mx-auto px-margin sm:px-margin-tablet pt-20 pb-24 md:pb-12"
    aria-live="polite"
  ></main>

  <!-- Barra de navegación inferior (Móvil) -->
  <nav
    id="app-bottom-nav"
    aria-label="Navegación principal móvil"
    class="md:hidden fixed bottom-0 inset-x-0 z-40 pb-safe glass-bottom-nav"
  ></nav>

  <!-- Portales globales para modales y notificaciones flotantes -->
  <div id="app-modal-root"></div>
  <div id="app-toast-root" aria-live="assertive" aria-atomic="true"></div>

  <!-- Punto de entrada modular ES Modules -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
